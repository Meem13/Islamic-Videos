name: Render video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 || true
          sudo apt-get install -y libasound2t64 libcups2t64 || sudo apt-get install -y libasound2 libcups2 || true

      - name: Install packages
        run: npm install

      - name: Render
        run: npx remotion render index.ts Story out/video.mp4 --codec=h264 --crf=20 --concurrency=2

      - name: Save the video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          retention-days: 7
